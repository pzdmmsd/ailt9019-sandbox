<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AILT9019 Vibe Coding Sandbox</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="intro">
          <p class="eyebrow">AILT9019 Week 1</p>
          <h1 id="app-title" class="app-title">Vibe Coding Sandbox</h1>
          <p class="summary">Generate a few self-test prompts from one lecture topic, then inspect the code changes that make the app behave correctly.</p>
        </div>

        <form id="question-form" class="tool-panel" novalidate>
          <label for="topic">Lecture topic</label>
          <textarea id="topic" name="topic" rows="4" maxlength="140" placeholder="Example: AI literacy and responsible data use"></textarea>

          <label for="count">Number of prompts</label>
          <input id="count" name="count" type="number" min="1" max="5" value="3">

          <button type="submit">Generate prompts</button>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </form>

        <section class="results" aria-labelledby="results-title">
          <h2 id="results-title">Self-test prompts</h2>
          <ol id="prompt-list"></ol>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
